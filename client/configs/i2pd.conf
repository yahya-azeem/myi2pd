# Client-only i2pd config optimized for low memory usage
ipv4 = true
ipv6 = false

[httpproxy]
address = 127.0.0.1
port = 4444
enabled = true

[socksproxy]
address = 127.0.0.1
port = 4447
enabled = true

[limits]
# Client node has zero transit tunnels to preserve memory and local CPU bandwidth
transittunnels = 0
share = 0
bandwidth = 0 # unlimited for client's own traffic
openfiles = 0
coresize = 0

[netdb]
# Client needs netdb to find routers, but keep caching efficient
netdb = true
