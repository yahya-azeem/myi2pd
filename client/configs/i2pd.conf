# Client-only i2pd config optimized for low memory usage
ipv4 = true
ipv6 = false
notransit = true
log = file
logfile = /var/log/i2pd/i2pd.log
loglevel = info

[httpproxy]
address = 127.0.0.1
port = 4444
enabled = true

[socksproxy]
address = 127.0.0.1
port = 4447
enabled = true

[limits]
transittunnels = 0
openfiles = 0
coresize = 0

[reseed]
verify = false
file = /var/lib/i2pd/reseed.su3
urls = https://reseed.i2p-projekt.de/,https://i2p.mooo.com/netDb/,https://netdb.i2p2.no/,https://reseed.memcpy.io/,https://reseed2.i2p.net/
