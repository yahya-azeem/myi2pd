// --- PROXY PROTECTION: Force all traffic into local i2pd socks proxy ---
defaultPref("network.proxy.type", 1);                        // Use manual proxy configuration
defaultPref("network.proxy.socks", "127.0.0.1");            // Target local loopback SOCKS proxy
defaultPref("network.proxy.socks_port", 4447);               // i2pd SOCKS proxy port
defaultPref("network.proxy.socks_version", 5);               // Force SOCKS5
defaultPref("network.proxy.socks_remote_dns", true);         // Force DNS resolving over SOCKS (Prevents ISP DNS leaks)
defaultPref("network.dns.blockDotOnion", false);             // Allow resolving onion/darknet addresses

// --- ANTI-FINGERPRINTING PARITY: Replicating Tor Browser Defaults ---
defaultPref("privacy.resistFingerprinting", true);           // Force Tor-style canvas and timezone spoofing
defaultPref("privacy.resistFingerprinting.letterboxing", true); // Enable Tor-style screen dimensions padding
defaultPref("webgl.disabled", true);                         // Disable WebGL to prevent GPU profiling
defaultPref("media.peerconnection.enabled", false);          // Disable WebRTC to block local IP leaks
defaultPref("browser.privatebrowsing.autostart", true);      // Force perpetual Private Browsing mode

// --- COMPLETE NETWORK ISOLATION: Cut off clear-web noise ---
defaultPref("network.http.referer.spoofSource", true);       // Mask header referers
defaultPref("dom.battery.enabled", false);                   // Block hardware API queries
defaultPref("geo.enabled", false);                           // Kill geolocation services
defaultPref("javascript.options.wasm", false);               // Disable WebAssembly to close exploit vectors

// --- CRITICAL EXPLOIT MITIGATION: Disable JavaScript JIT ---
defaultPref("javascript.options.ion", false);
defaultPref("javascript.options.baselinejit", false);
defaultPref("javascript.options.native_regexp", false);

// --- FORCE STRICT HTTPS (FAIL-SAFE DEFAULTS) ---
defaultPref("dom.security.https_only_mode", true);             // Enforce HTTPS-Only Mode globally
defaultPref("dom.security.https_only_mode_pbm", true);         // Enforce HTTPS-Only Mode in Private Windows
defaultPref("dom.security.https_only_mode_error_page", true);  // Explicitly block HTTP fallback options
defaultPref("dom.security.block_download_insecure", true);     // Block HTTP downloads on an HTTPS page
defaultPref("extensions.webextensions.restrictedDomains", "://mozilla.com,addons.mozilla.org");
