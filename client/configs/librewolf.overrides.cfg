// ============================================================
// myi2pd LibreWolf Overrides — LibreWolf built-in maximum hardening
// Uses LibreWolf's native privacy.resistFingerprinting (Tor Browser parity)
// No external user.js (Arkenfox) — avoids conflicts with native protections
// ============================================================

// --- SOCKS PROXY (forced into i2pd tunnel) ---
defaultPref("network.proxy.type", 1);
defaultPref("network.proxy.socks", "10.10.10.1");
defaultPref("network.proxy.socks_port", 4447);
defaultPref("network.proxy.socks_version", 5);
defaultPref("network.proxy.socks_remote_dns", true);
defaultPref("network.dns.blockDotOnion", false);

// --- ANTI-FINGERPRINTING (LibreWolf native: privacy.resistFingerprinting = Tor Browser parity) ---
defaultPref("privacy.resistFingerprinting", true);
defaultPref("privacy.resistFingerprinting.letterboxing", true);
defaultPref("privacy.resistFingerprinting.autoDeclineNoUserInputCanvasPrompts", true);
defaultPref("webgl.disabled", true);
defaultPref("media.peerconnection.enabled", false);
defaultPref("browser.privatebrowsing.autostart", true);

// --- NETWORK HARDENING ---
defaultPref("network.http.referer.spoofSource", true);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.dns.disablePrefetchFromHTTPS", true);
defaultPref("network.predictor.enabled", false);
defaultPref("network.prefetch-next", false);
defaultPref("network.trr.mode", 5);
defaultPref("browser.urlbar.speculativeConnect.enabled", false);
defaultPref("browser.urlbar.suggest.searches", false);

// --- API / EXPLOIT MITIGATION ---
defaultPref("dom.battery.enabled", false);
defaultPref("geo.enabled", false);
defaultPref("javascript.options.wasm", false);
defaultPref("javascript.options.ion", false);
defaultPref("javascript.options.baselinejit", false);
defaultPref("javascript.options.native_regexp", false);

// --- OCSP / CERTIFICATE HARDENING ---
defaultPref("security.OCSP.enabled", 1);
defaultPref("security.OCSP.require", true);
defaultPref("security.remote_settings.crlite_filters.enabled", true);
defaultPref("security.pki.crlite_mode", 2);
defaultPref("security.pki.sha1_enforcement_level", 4);

// --- HTTPS-ONLY ---
defaultPref("dom.security.https_only_mode", true);
defaultPref("dom.security.https_only_mode_pbm", true);
defaultPref("dom.security.https_only_mode_error_page", true);
defaultPref("dom.security.block_download_insecure", true);

// --- TELEMETRY / STUDIES / DATA ---
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("browser.ping-centre.telemetry", false);
defaultPref("toolkit.telemetry.unified", false);
defaultPref("toolkit.telemetry.enabled", false);
defaultPref("toolkit.telemetry.server", "");
defaultPref("toolkit.telemetry.archive.enabled", false);
defaultPref("toolkit.telemetry.bhrPing.enabled", false);
defaultPref("toolkit.telemetry.firstShutdownPing.enabled", false);
defaultPref("toolkit.telemetry.hybridContent.enabled", false);
defaultPref("toolkit.telemetry.newProfilePing.enabled", false);
defaultPref("toolkit.telemetry.shutdownPingSender.enabled", false);
defaultPref("toolkit.telemetry.updatePing.enabled", false);
defaultPref("toolkit.telemetry.cachedClientID", "");
defaultPref("app.shield.optoutstudies.enabled", false);
defaultPref("browser.discovery.enabled", false);
defaultPref("browser.safebrowsing.downloads.remote.enabled", false);
defaultPref("extensions.getAddons.showPane", false);
defaultPref("extensions.htmlaboutaddons.recommendations.enabled", false);

// --- DISK AVOIDANCE (RAM-only live environment) ---
defaultPref("browser.cache.disk.enable", false);
defaultPref("browser.cache.disk_cache_ssl", false);
defaultPref("browser.cache.offline.enable", false);
defaultPref("media.ffmpeg.vaapi.enabled", false);
defaultPref("gfx.webrender.all", false);

// --- SANITIZE ON SHUTDOWN ---
defaultPref("privacy.sanitize.sanitizeOnShutdown", true);
defaultPref("privacy.clearOnShutdown.cache", true);
defaultPref("privacy.clearOnShutdown.cookies", true);
defaultPref("privacy.clearOnShutdown.downloads", true);
defaultPref("privacy.clearOnShutdown.formdata", true);
defaultPref("privacy.clearOnShutdown.history", true);
defaultPref("privacy.clearOnShutdown.offlineApps", true);
defaultPref("privacy.clearOnShutdown.sessions", true);
defaultPref("privacy.sanitize.timeSpan", 0);

// --- CONTAINERS (eepsite isolation) ---
defaultPref("privacy.userContext.enabled", true);
defaultPref("privacy.userContext.ui.enabled", true);

// --- UX TWEAKS ---
defaultPref("browser.startup.page", 0);
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("browser.aboutConfig.showWarning", false);
defaultPref("browser.tabs.firefox-view", false);
defaultPref("browser.tabs.unloadOnLowMemory", true);

// --- STRICT EXTENSION RESTRICTIONS ---
defaultPref("extensions.webextensions.restrictedDomains", "://mozilla.com,addons.mozilla.org");

// --- JAVASCRIPT OFF BY DEFAULT (I2P eepsites rarely need JS) ---
defaultPref("javascript.enabled", false);

// --- DARK MODE (browser chrome + web content) ---
defaultPref("ui.systemUsesDarkTheme", 1);
defaultPref("layout.css.prefers-color-scheme.content", 3);
defaultPref("extensions.darkreader.detailed", false);
defaultPref("extensions.darkreader.enableByDefault", true);

// --- SANDBOX ---
defaultPref("security.sandbox.content.level", 2);
defaultPref("security.sandbox.gpu.level", 1);