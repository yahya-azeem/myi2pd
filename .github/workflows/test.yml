name: Test myi2pd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-tests:
    name: Static tests (no VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run static test suite
        run: |
          chmod +x tests/*.sh
          ./tests/run_tests.sh

  iso-validation:
    name: Build + validate ISOs
    runs-on: ubuntu-latest
    needs: static-tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        iso: [amnesiac, vps]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for binfmt)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.iso }} ISO
        run: |
          chmod +x client/build_iso.sh
          if [ "${{ matrix.iso }}" = "amnesiac" ]; then
            ./client/build_iso.sh
          else
            # VPS is built from vps/ via its own pipeline
            echo "VPS ISO build is covered by the main build workflow"
            exit 0
          fi

      - name: Validate built ISO apkovl (no boot)
        if: matrix.iso == 'amnesiac'
        run: |
          ./tests/run_tests.sh --only iso -i myi2pd-amnesiac.iso
