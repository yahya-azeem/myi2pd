name: Deploy VPS and Build Amnesiac ISO

on:
  workflow_dispatch:

jobs:
  build_iso:
    name: Build Amnesiac Client ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Custom Alpine ISO
        run: |
          chmod +x client/build_iso.sh
          ./client/build_iso.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myi2pd-amnesiac-iso
          path: myi2pd-amnesiac.iso
          compression-level: 0
          retention-days: 7

  deploy_vps:
    name: Deploy Hardened VPS Gateway
    needs: build_iso
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Clean up Conflicting myi2pd Resources (Stay in Free Tier)
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          chmod +x shared/destroy_old_vps.sh
          ./shared/destroy_old_vps.sh

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Install Packer plugins
        working-directory: vps/packer
        run: packer init vps_image.pkr.hcl

      - name: Build VPS Packer Snapshot
        working-directory: vps/packer
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: packer build vps_image.pkr.hcl

      - name: Terraform Init
        working-directory: vps/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: vps/terraform
        env:
          TF_VAR_vultr_api_key: ${{ secrets.VULTR_API_KEY }}
        run: terraform apply -auto-approve

      - name: Extract and Print VPS Public IP
        working-directory: vps/terraform
        run: |
          VPS_IP=$(terraform output -raw vps_ip)
          echo "=================================================="
          echo "    myi2pd VPS Gateway successfully deployed!     "
          echo "    Public IP Address: $VPS_IP                    "
          echo "=================================================="
