name: Deploy VPS and Build Amnesiac ISO

on:
  workflow_dispatch:

jobs:
  build_iso:
    name: Build Amnesiac Client ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image with Caching
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          tags: myi2pd-builder:latest
          outputs: type=docker,dest=/tmp/myi2pd-builder.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load Docker Image
        run: |
          docker load -i /tmp/myi2pd-builder.tar
          docker tag myi2pd-builder:latest myi2pd-builder

      - name: Build Custom Alpine ISO
        run: |
          chmod +x client/build_iso.sh
          ./client/build_iso.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myi2pd-amnesiac-iso
          path: myi2pd-amnesiac.iso
          compression-level: 0
          retention-days: 7

  deploy_vps:
    name: Deploy or Restore VPS Gateway
    needs: build_iso
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Run Deploy or Restore Manager
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VPS_IP: ${{ secrets.VPS_IP }}
        run: |
          chmod +x shared/deploy_or_restore.sh
          ./shared/deploy_or_restore.sh
