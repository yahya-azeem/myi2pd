# Tuned low-resource i2pd config for 512MB VPS
port = 25432
ipv4 = true
ipv6 = false

[httpproxy]
enabled = false
address = 127.0.0.1
port = 4444

[socksproxy]
enabled = false
address = 127.0.0.1
port = 4447

[limits]
# Aggressively constrain memory consumption for Free Tier VPS
transittunnels = 10
share = 10
bandwidth = 256
openfiles = 0
coresize = 0

[netdb]
# Avoid caching the full netdb to disk/RAM
netdb = false
